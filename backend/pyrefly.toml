# Pyrefly configuration for T-Lingua backend
python-interpreter-path = "venv/Scripts/python.exe"
search-path = [".", ".."]
infer-with-first-use = false

[errors]
# SQLAlchemy ORM InstrumentedAttribute descriptor assignments & narrowing
bad-argument-type = false
bad-assignment = false
missing-attribute = false
no-matching-overload = false
unsupported-operation = false
bad-index = false
bad-context-manager = false
not-callable = false
bad-return = false

