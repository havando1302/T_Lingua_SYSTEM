version: '3.8'

services:
  backend:
    build: .
    container_name: translator_backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      # Ánh xạ thư mục data để lưu vĩnh viễn Translation Memory và Context
      - ./data:/app/data
      # Ánh xạ huggingface cache để không phải tải lại model AI mỗi lần xóa container
      - ./outputs:/app/outputs
      - hf_cache:/home/tlingua/.cache/huggingface
    environment:
      - API_HOST=0.0.0.0
      - NVIDIA_VISIBLE_DEVICES=all
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /app/temp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 16g
    cpus: 8.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf_cache:
