version: '3.8'

services:
  # 1. Backend (FastAPI + GPU + SQLite DB)
  ai_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tlingua_backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./data:/app/data # Gắn volume chung để lưu DB và Translation Memory
      - ./backend/outputs:/app/outputs
      - hf_cache:/home/tlingua/.cache/huggingface
    environment:
      - API_HOST=0.0.0.0
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONPATH=/app
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /app/temp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 16g
    cpus: 8.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # 2. Admin Web (React)
  admin_dashboard:
    build:
      context: ./admin_web
      dockerfile: Dockerfile
    container_name: tlingua_admin_web
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      ai_backend:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  data:
    driver: local
  hf_cache:
